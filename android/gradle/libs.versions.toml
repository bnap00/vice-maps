# Versions match Ferrostar 0.59.0's own tested build (stadiamaps/ferrostar android/gradle/libs.versions.toml).
[versions]
agp = "9.0.1"
kotlin = "2.3.20"
ferrostar = "0.59.0"
desugar_jdk_libs = "2.1.5"
ktx = "1.17.0"
appcompat = "1.7.1"
lifecycle = "2.10.0"
activity-compose = "1.13.0"
compose-bom = "2026.02.01"
car-app = "1.7.0"
okhttp = "5.3.2"
maplibre-compose = "0.13.0"
car-app-compose = "0.0.2"
play-services-location = "21.3.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
junit = "4.13.2"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }
androidx-ktx = { module = "androidx.core:core-ktx", version.ref = "ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
car-app = { module = "androidx.car.app:app", version.ref = "car-app" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose-android", version.ref = "maplibre-compose" }
car-app-compose = { module = "io.github.rallista:car-app-compose", version.ref = "car-app-compose" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
ferrostar-core = { module = "com.stadiamaps.ferrostar:core", version.ref = "ferrostar" }
ferrostar-car-app = { module = "com.stadiamaps.ferrostar:car-app", version.ref = "ferrostar" }
ferrostar-gms = { module = "com.stadiamaps.ferrostar:google-play-services", version.ref = "ferrostar" }
ferrostar-ui-compose = { module = "com.stadiamaps.ferrostar:ui-compose", version.ref = "ferrostar" }
ferrostar-ui-maplibre = { module = "com.stadiamaps.ferrostar:ui-maplibre", version.ref = "ferrostar" }
ferrostar-ui-maplibre-car-app = { module = "com.stadiamaps.ferrostar:ui-maplibre-car-app", version.ref = "ferrostar" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
